name: 9router

services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:custom
    container_name: 9router
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/containers/9ROUTER/data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Neo4j is the only identity-memory backend (Hindsight was removed).
      NEO4J_HTTP_URL: ${NEO4J_HTTP_URL:-http://127.0.0.1:7474}
