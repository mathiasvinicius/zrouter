name: zrouter-staging

services:
  zrouter:
    build:
      context: .
      dockerfile: Dockerfile
    image: zrouter:custom
    container_name: zrouter-staging
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/containers/zrouter/data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20129"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Neo4j is the only identity-memory backend (Hindsight was removed).
      NEO4J_HTTP_URL: ${NEO4J_HTTP_URL:-http://127.0.0.1:7474}
