name: zrouter

# ZRouter — Sovereign AI Gateway (ITMS Solutions)
# Baseado em 9Router (MIT, github.com/decolua/9router) + OmniRoute (MIT)
#
# Start básico (só o gateway, apontando para o Neo4j que NEO4J_HTTP_URL definir):
#   cp .env.example .env   (edite as senhas!)
#   docker compose up -d
#
# Com as dependências embutidas (Neo4j + Open Notebook + SurrealDB) nesta máquina:
#   docker compose --profile bundled up -d
#
# As dependências estão EMBUTIDAS mas NÃO obrigatórias: ficam atrás do profile
# opt-in "bundled" e o depends_on usa required:false, então a ausência delas
# nunca impede o gateway de subir (deploy remoto pode usar um Neo4j externo).

services:
  # ── Core ──────────────────────────────────────────────────────
  zrouter:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: zrouter:latest
    container_name: zrouter
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./.env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Aponta para QUALQUER Neo4j — o bundled, um local ou um remoto
      # (ex.: http://<host-tailscale>:7474, acessível pela rede Tailscale).
      NEO4J_HTTP_URL: ${NEO4J_HTTP_URL:-http://127.0.0.1:7474}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
      OPEN_NOTEBOOK_URL: ${OPEN_NOTEBOOK_URL:-http://127.0.0.1:5055}
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_started
        required: false        # ausente do projeto NÃO bloqueia o zrouter
      open-notebook:
        condition: service_started
        required: false

  # ── Dependências embutidas (profile opt-in: bundled) ──────────
  neo4j:
    image: neo4j:5.26-community
    container_name: zrouter-neo4j
    profiles: ["bundled"]
    restart: unless-stopped
    ports:
      # Bind em loopback: para acesso remoto use a rede Tailscale.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change-me-neo4j}
      # ── memória: defaults de host modesto; host ≤4GB deve baixar para
      #    512M/256M/512M no .env (veja .env.example)
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512M}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # ── JVM
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: zrouter-surrealdb
    profiles: ["bundled"]
    restart: unless-stopped
    # Open Notebook usa rocksdb local; credenciais fortes via .env
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-open_notebook}", "--pass", "${SURREAL_PASSWORD:-change-me-surreal}", "rocksdb:/mydata/mydatabase.db"]
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    volumes:
      - ./data/surrealdb:/mydata

  open-notebook:
    image: lfnovo/open_notebook:v1-latest
    container_name: zrouter-open-notebook
    profiles: ["bundled"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5055:5055"
      - "127.0.0.1:8502:8502"
    depends_on:
      - surrealdb
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-32-chars-minimum-secret}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREAL_USER:-open_notebook}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:-change-me-surreal}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      # LLM/embeddings via 9Router (ou qualquer endpoint OpenAI-compatible)
      # Configure providers no dashboard na primeira execução
    volumes:
      - ./data/open-notebook:/app/data
